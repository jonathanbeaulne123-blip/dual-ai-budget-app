<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; color: #263238; background: #fff; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 16px; font-size: 14px; }
      h1 { margin: 0 0 4px; font-size: 20px; }
      .intro { margin: 0 0 16px; color: #5f6368; line-height: 1.4; }
      label { display: block; margin: 12px 0 5px; font-weight: 700; }
      input, select, button { width: 100%; min-height: 44px; border-radius: 6px; font: inherit; }
      input, select { border: 1px solid #bdc1c6; padding: 9px 10px; background: #fff; }
      input:focus, select:focus { border-color: #1a73e8; outline: 2px solid #d2e3fc; }
      .row { display: flex; gap: 12px; }
      .row > div { flex: 1; min-width: 0; }
      #preview { margin-top: 16px; padding: 12px; border: 1px solid #d7e5da; border-radius: 8px; background: #f3f8f4; line-height: 1.5; }
      #preview.loading { border-color: #d2e3fc; background: #f5f8ff; }
      #preview.error { border-color: #f2b8b5; background: #fce8e6; }
      .previewTitle { font-weight: 700; margin-bottom: 4px; }
      .totals { margin-top: 7px; font-size: 16px; font-weight: 700; }
      .settings { margin-top: 7px; color: #5f6368; font-size: 12px; }
      .warning { margin-top: 6px; color: #9a6700; font-weight: 700; }
      .actions { position: sticky; bottom: 0; padding-top: 14px; background: #fff; }
      button { padding: 10px 16px; border: 0; cursor: pointer; font-weight: 700; }
      #submitBtn { background: #188038; color: #fff; }
      #submitBtn:disabled { background: #a8c7b0; cursor: default; }
      #closeBtn { display: none; margin-top: 10px; border: 1px solid #bdc1c6; background: #fff; }
      #msg { min-height: 20px; margin-top: 10px; line-height: 1.45; }
      #msg.error { color: #b3261e; }
      #msg.success { color: #137333; }
      #msg.warning { color: #8a5b00; }
      @media (max-width: 430px) {
        body { padding: 12px; }
        .row { display: block; }
        h1 { font-size: 19px; }
      }
    </style>
  </head>
  <body>
    <h1>Add a shift</h1>
    <p class="intro">Enter the shift once. The preview below is the same calculation used to post one Wages record and one Tips record.</p>

    <form id="shiftForm" novalidate>
      <label for="date">Date</label>
      <input type="date" id="date" value="<?= today ?>" required>

      <label for="memberId">Who worked this shift?</label>
      <select id="memberId" required>
        <? for (var i = 0; i < members.length; i++) { ?>
          <option value="<?= members[i].id ?>"><?= members[i].name ?></option>
        <? } ?>
      </select>

      <div class="row">
        <div>
          <label for="sales">Sales (CAD)</label>
          <input type="number" inputmode="decimal" id="sales" step="0.01" min="0" value="0" required>
        </div>
        <div>
          <label for="hours">Hours worked</label>
          <input type="number" inputmode="decimal" id="hours" step="0.01" min="0.01" max="24" required>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="cashTips">Cash tips (CAD)</label>
          <input type="number" inputmode="decimal" id="cashTips" step="0.01" min="0" value="0" required>
        </div>
        <div>
          <label for="ccTips">Credit-card tips (CAD)</label>
          <input type="number" inputmode="decimal" id="ccTips" step="0.01" min="0" value="0" required>
        </div>
      </div>

      <section id="preview" class="loading" aria-live="polite" aria-busy="true">
        <div class="previewTitle" id="previewTitle">Calculating preview…</div>
        <div id="breakdown"></div>
        <div class="totals" id="totals"></div>
        <div class="settings" id="settings"></div>
        <div class="warning" id="previewWarning"></div>
      </section>

      <div class="actions">
        <button type="submit" id="submitBtn" disabled>Log shift</button>
        <button type="button" id="closeBtn">Close</button>
      </div>
    </form>
    <div id="msg" aria-live="assertive"></div>

    <script>
      var previewTimer = null;
      var previewRequestId = 0;
      var previewReady = false;
      var previewInputKey = '';
      var settingsFingerprint = '';
      var submitting = false;

      (function initialize() {
        var member = document.getElementById('memberId');
        for (var i = 0; i < member.options.length; i++) {
          if (/jonathan/i.test(member.options[i].text)) { member.selectedIndex = i; break; }
        }
        ['sales', 'hours', 'cashTips', 'ccTips'].forEach(function (id) {
          document.getElementById(id).addEventListener('input', schedulePreview);
        });
        document.getElementById('shiftForm').addEventListener('submit', function (event) {
          event.preventDefault();
          submitShift(false);
        });
        document.getElementById('closeBtn').addEventListener('click', function () { google.script.host.close(); });
        requestPreview();
      })();

      function calculationFields() {
        return {
          sales: document.getElementById('sales').value,
          cashTips: document.getElementById('cashTips').value,
          ccTips: document.getElementById('ccTips').value,
          hours: document.getElementById('hours').value
        };
      }

      function calculationKey() { return JSON.stringify(calculationFields()); }

      function schedulePreview() {
        previewReady = false;
        settingsFingerprint = '';
        updateSubmitState();
        clearTimeout(previewTimer);
        previewTimer = setTimeout(requestPreview, 180);
      }

      function requestPreview() {
        clearTimeout(previewTimer);
        var requestKey = calculationKey();
        var requestId = ++previewRequestId;
        setPreviewState('Calculating preview…', '', '', '', '', 'loading', true);
        google.script.run
          .withSuccessHandler(function (preview) {
            if (requestId !== previewRequestId || requestKey !== calculationKey()) return;
            renderPreview(preview);
            previewInputKey = requestKey;
            settingsFingerprint = preview.settingsFingerprint || '';
            previewReady = !!preview.ready && !!settingsFingerprint;
            updateSubmitState();
          })
          .withFailureHandler(function (error) {
            if (requestId !== previewRequestId) return;
            previewReady = false;
            settingsFingerprint = '';
            setPreviewState('Preview unavailable', errorMessage(error), '', '', '', 'error', false);
            setMsg('Correct the values or retry the preview before logging this shift.', 'error');
            updateSubmitState();
          })
          .getShiftPreview(calculationFields());
      }

      function renderPreview(preview) {
        var calc = preview.calculation;
        var rules = preview.settings;
        var warning = calc.netTips < 0 ? 'Net tips are negative. Check the entered tips and sales before posting.' : '';
        setPreviewState(
          preview.ready ? 'Ready to post' : 'Enter hours worked to finish the preview',
          'Tip-out: $' + money(calc.floorTipOut) + ' floor + $' + money(calc.barTipOut) +
            ' bar + $' + money(calc.ccTipOut) + ' credit-card',
          'Net tips: $' + money(calc.netTips) + ' · Wages: $' + money(calc.wages),
          'Rules: floor ' + rules.floorPct + '%, bar ' + rules.barPct + '% rounded up to $' +
            money(rules.barRound) + ', credit-card ' + rules.ccPct + '%, wage $' +
            money(rules.hourlyRate) + '/hr',
          warning, '', false
        );
      }

      function setPreviewState(title, breakdown, totals, settings, warning, cls, busy) {
        var preview = document.getElementById('preview');
        preview.className = cls || '';
        preview.setAttribute('aria-busy', busy ? 'true' : 'false');
        document.getElementById('previewTitle').textContent = title;
        document.getElementById('breakdown').textContent = breakdown;
        document.getElementById('totals').textContent = totals;
        document.getElementById('settings').textContent = settings;
        document.getElementById('previewWarning').textContent = warning;
      }

      function currentForm(confirmed) {
        var fields = calculationFields();
        return {
          date: document.getElementById('date').value,
          memberId: document.getElementById('memberId').value,
          sales: fields.sales,
          cashTips: fields.cashTips,
          ccTips: fields.ccTips,
          hours: fields.hours,
          settingsFingerprint: settingsFingerprint,
          confirmed: confirmed
        };
      }

      function submitShift(confirmed) {
        var formElement = document.getElementById('shiftForm');
        if (!formElement.reportValidity()) return;
        if (!previewReady || previewInputKey !== calculationKey() || !settingsFingerprint) {
          setMsg('Wait for the current preview before logging this shift.', 'warning');
          requestPreview();
          return;
        }
        submitting = true;
        updateSubmitState();
        setMsg('Logging this shift…', '');
        google.script.run
          .withSuccessHandler(onResult)
          .withFailureHandler(function (error) {
            submitting = false;
            updateSubmitState();
            setMsg(errorMessage(error), 'error');
          })
          .addShift(currentForm(confirmed));
      }

      function onResult(result) {
        submitting = false;
        if (result.settingsChanged) {
          renderPreview(result.preview);
          previewInputKey = calculationKey();
          settingsFingerprint = result.preview.settingsFingerprint || '';
          previewReady = !!result.preview.ready && !!settingsFingerprint;
          updateSubmitState();
          setMsg(result.message, 'warning');
          return;
        }
        if (result.duplicate) {
          updateSubmitState();
          if (confirm(result.message)) submitShift(true);
          else setMsg('Nothing was saved.', '');
          return;
        }
        if (!result.ok) {
          updateSubmitState();
          setMsg(result.message || 'The shift was not saved.', 'error');
          return;
        }
        setMsg(result.message, result.warnings && result.warnings.length ? 'warning' : 'success');
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('closeBtn').style.display = 'block';
        Array.prototype.forEach.call(document.querySelectorAll('input, select'), function (control) { control.disabled = true; });
      }

      function updateSubmitState() {
        document.getElementById('submitBtn').disabled = submitting || !previewReady ||
          previewInputKey !== calculationKey() || !settingsFingerprint;
      }

      function money(value) { return Number(value).toFixed(2); }
      function errorMessage(error) { return error && error.message ? error.message : String(error); }
      function setMsg(text, cls) {
        var message = document.getElementById('msg');
        message.textContent = text || '';
        message.className = cls || '';
      }
    </script>
  </body>
</html>

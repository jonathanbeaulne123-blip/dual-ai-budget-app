<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; font-size: 13px; color: #333; padding: 12px 16px; }
      h3 { margin: 0 0 12px 0; font-size: 15px; }
      label { display: block; margin-top: 10px; font-weight: bold; font-size: 12px; }
      input, select { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 3px; font-size: 13px; }
      .row { display: flex; gap: 10px; }
      .row > div { flex: 1; }
      #preview { margin-top: 14px; padding: 10px; background: #f4f6f4; border-radius: 6px; font-size: 12px; line-height: 1.7; display: none; }
      #preview.show { display: block; }
      #preview .big { font-weight: bold; font-size: 13px; }
      #preview .breakdown { color: #6b6b68; }
      button { margin-top: 16px; padding: 8px 16px; font-size: 13px; cursor: pointer; border-radius: 4px; }
      #submitBtn { background: #34a853; color: white; border: none; }
      #submitBtn:disabled { background: #a5d6b5; cursor: default; }
      #msg { margin-top: 12px; font-size: 12px; }
      #msg.error { color: #a52a2a; }
      #msg.success { color: #0a6b0a; }
      #closeRow { display: none; margin-top: 10px; }
    </style>
  </head>
  <body>
    <h3>Add a shift</h3>
    <form id="shiftForm" novalidate>
      <label>Date</label>
      <input type="date" id="date" required>

      <label>Who worked this shift?</label>
      <select id="memberId">
        <? for (var i = 0; i < members.length; i++) { ?>
          <option value="<?= members[i].id ?>"><?= members[i].name ?></option>
        <? } ?>
      </select>

      <div class="row">
        <div>
          <label>Sales ($)</label>
          <input type="number" id="sales" step="0.01" min="0" value="0">
        </div>
        <div>
          <label>Hours worked</label>
          <input type="number" id="hours" step="0.01" min="0.01" required>
        </div>
      </div>

      <div class="row">
        <div>
          <label>Cash tips ($)</label>
          <input type="number" id="cashTips" step="0.01" min="0" value="0">
        </div>
        <div>
          <label>Credit card tips ($)</label>
          <input type="number" id="ccTips" step="0.01" min="0" value="0">
        </div>
      </div>

      <div id="preview"></div>

      <button type="submit" id="submitBtn">Log shift</button>
    </form>
    <div id="msg"></div>
    <div id="closeRow"><button type="button" onclick="google.script.host.close()">Close</button></div>

    <script>
      var SETTINGS = null; // fetched once for the live preview only — the server recalculates for real on submit

      document.getElementById('date').valueAsDate = new Date();
      (function preselectMember() {
        var sel = document.getElementById('memberId');
        for (var i = 0; i < sel.options.length; i++) {
          if (/jonathan/i.test(sel.options[i].text)) { sel.selectedIndex = i; break; }
        }
      })();

      // Wire up the actual form submission FIRST, unconditionally — before
      // touching anything related to the live preview below. The live
      // preview is a nice-to-have; if fetching its settings ever fails
      // (wrong/old server-side code, network hiccup, anything), that must
      // never be able to prevent the real "Log Shift" button from working.
      document.getElementById('shiftForm').addEventListener('submit', function (e) {
        e.preventDefault();
        submitShift(false);
      });

      ['sales', 'hours', 'cashTips', 'ccTips'].forEach(function (id) {
        document.getElementById(id).addEventListener('input', recalcPreview);
      });

      // Optional live preview — wrapped so a failure here (e.g. this exact
      // function not existing yet on the server, which throws a plain
      // synchronous TypeError, not a withFailureHandler callback) can't take
      // down the rest of the script.
      try {
        google.script.run.withSuccessHandler(function (settings) {
          SETTINGS = settings;
          recalcPreview();
        }).withFailureHandler(function (err) {
          console.error('Tip Tracker preview settings failed to load:', err);
        }).getTipTrackerSettingsForPreview_();
      } catch (e) {
        console.error('Live preview unavailable (Add Shift will still work without it):', e);
      }

      function recalcPreview() {
        var preview = document.getElementById('preview');
        if (!SETTINGS) { preview.classList.remove('show'); return; }
        var sales = Number(document.getElementById('sales').value) || 0;
        var cashTips = Number(document.getElementById('cashTips').value) || 0;
        var ccTips = Number(document.getElementById('ccTips').value) || 0;
        var hours = Number(document.getElementById('hours').value) || 0;
        var floor = sales * SETTINGS.floorPct / 100;
        var barRaw = sales * SETTINGS.barPct / 100;
        var bar = SETTINGS.barRound > 0 ? Math.ceil(barRaw / SETTINGS.barRound) * SETTINGS.barRound : barRaw;
        var cc = ccTips * SETTINGS.ccPct / 100;
        var netTips = cashTips + ccTips - floor - bar - cc;
        var wages = hours * SETTINGS.hourlyRate;
        preview.classList.add('show');
        preview.innerHTML =
          '<div class="breakdown">Floor tip-out: $' + floor.toFixed(2) + ' &nbsp; Bar tip-out: $' + bar.toFixed(2) + ' &nbsp; CC tip-out: $' + cc.toFixed(2) + '</div>' +
          '<div class="big">Net tips: $' + netTips.toFixed(2) + ' &nbsp;&nbsp; Wages: $' + wages.toFixed(2) + '</div>';
      }

      function currentForm(confirmed) {
        return {
          date: document.getElementById('date').value,
          memberId: document.getElementById('memberId').value,
          sales: document.getElementById('sales').value,
          cashTips: document.getElementById('cashTips').value,
          ccTips: document.getElementById('ccTips').value,
          hours: document.getElementById('hours').value,
          confirmed: confirmed
        };
      }

      function submitShift(confirmed) {
        try {
          var form = currentForm(confirmed);
          if (!form.date) { setMsg('Please choose a date.', 'error'); return; }
          if (!form.hours || Number(form.hours) <= 0) { setMsg('Please enter hours worked (must be greater than 0).', 'error'); return; }

          var btn = document.getElementById('submitBtn');
          btn.disabled = true;
          setMsg('Logging…', '');
          google.script.run
            .withSuccessHandler(function (result) { onResult(result); btn.disabled = false; })
            .withFailureHandler(function (err) { setMsg((err && err.message) || String(err), 'error'); btn.disabled = false; })
            .addShift(form);
        } catch (e) {
          setMsg('Unexpected error: ' + (e && e.message ? e.message : e), 'error');
        }
      }

      function onResult(result) {
        if (result.duplicate) {
          if (confirm(result.message)) {
            submitShift(true);
          }
          return;
        }
        setMsg(result.message, 'success');
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('closeRow').style.display = 'block';
      }

      function setMsg(text, cls) {
        var msg = document.getElementById('msg');
        msg.textContent = text;
        msg.className = cls || '';
      }
    </script>
  </body>
</html>

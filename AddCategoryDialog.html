<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; padding: 4px 8px; color: #222; }
  h3 { margin: 0 0 12px; font-size: 15px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #555; margin: 12px 0 4px; }
  input, select { width: 100%; box-sizing: border-box; padding: 7px 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; }
  .type-toggle { display: flex; gap: 8px; }
  .type-toggle button { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #ccc; background: #f4f4f4; cursor: pointer; font-size: 13px; font-weight: 600; }
  .type-toggle button.active.income { background: #e6f6e6; border-color: #0ca30c; color: #0ca30c; }
  .type-toggle button.active.expense { background: #fdeee7; border-color: #ec835a; color: #b85a34; }
  .row2 { display: flex; gap: 8px; }
  .row2 > div { flex: 1; }
  .hint { font-size: 11px; color: #888; margin-top: 4px; }
  .actions { margin-top: 18px; display: flex; justify-content: flex-end; gap: 8px; }
  button.primary { background: #2a78d6; color: #fff; border: none; padding: 9px 18px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
  button.primary:disabled { background: #9db8dd; cursor: default; }
  button.secondary { background: none; border: 1px solid #ccc; padding: 9px 14px; border-radius: 6px; cursor: pointer; }
  .msg { margin-top: 12px; font-size: 13px; padding: 8px 10px; border-radius: 6px; display: none; }
  .msg.ok { background: #e6f6e6; color: #0a6b0a; display: block; }
  .msg.err { background: #fbe8e8; color: #a52a2a; display: block; }
  .hidden { display: none; }
  .amount-row { display: flex; align-items: center; }
  .amount-row span { padding: 0 6px; color: #888; }
</style>
</head>
<body>
  <h3>Add a category</h3>

  <label>Type</label>
  <div class="type-toggle">
    <button type="button" id="btnExpense" class="active expense" onclick="setType('Expense')">Expense</button>
    <button type="button" id="btnIncome" class="income" onclick="setType('Income')">Income</button>
  </div>
  <input type="hidden" id="type" value="Expense">

  <label>Name</label>
  <input type="text" id="name" placeholder="e.g. Pet Care">

  <div id="expenseFields">
    <label>Group</label>
    <select id="parent"></select>
    <div id="newGroupWrap" class="hidden">
      <label>New group name</label>
      <input type="text" id="newGroupName" placeholder="e.g. Pets">
    </div>

    <label>Essential?</label>
    <select id="essential">
      <option value="N">No — lifestyle / discretionary</option>
      <option value="Y">Yes — essential bill</option>
    </select>
  </div>

  <div id="incomeFields" class="hidden">
    <label>Is this steady/guaranteed, or does it vary?</label>
    <select id="incomeStability">
      <option value="Fixed">Fixed — same every month</option>
      <option value="Variable">Variable — changes month to month</option>
    </select>
  </div>

  <label>Set a monthly budget now? (optional)</label>
  <div class="amount-row"><span>$</span><input type="number" id="monthlyBudget" step="0.01" min="0" placeholder="Leave blank to skip"></div>
  <div class="hint">If set, this also adds a Budget Plan row for the month currently selected on the Budget sheet.</div>

  <div class="msg" id="msg"></div>

  <div class="actions">
    <button class="secondary" onclick="google.script.host.close()">Cancel</button>
    <button class="primary" id="submitBtn" onclick="submitForm()">Add category</button>
  </div>

<script>
  var TOP_LEVEL = <?!= JSON.stringify(topLevel) ?>;

  var parentSelect = document.getElementById('parent');
  function renderParents() {
    parentSelect.innerHTML = '';
    TOP_LEVEL.filter(function (c) { return c.transactionType === 'Expense'; })
      .forEach(function (c) {
        var opt = document.createElement('option');
        opt.value = c.id; opt.textContent = c.name;
        parentSelect.appendChild(opt);
      });
    var newOpt = document.createElement('option');
    newOpt.value = '__new__'; newOpt.textContent = '+ New group…';
    parentSelect.appendChild(newOpt);
  }
  renderParents();

  parentSelect.addEventListener('change', function () {
    document.getElementById('newGroupWrap').className = parentSelect.value === '__new__' ? '' : 'hidden';
  });

  function setType(type) {
    document.getElementById('type').value = type;
    document.getElementById('btnExpense').className = 'expense' + (type === 'Expense' ? ' active' : '');
    document.getElementById('btnIncome').className = 'income' + (type === 'Income' ? ' active' : '');
    document.getElementById('expenseFields').className = type === 'Expense' ? '' : 'hidden';
    document.getElementById('incomeFields').className = type === 'Income' ? '' : 'hidden';
  }
  setType('Expense');

  function submitForm() {
    var msg = document.getElementById('msg');
    msg.className = 'msg'; msg.textContent = '';
    var btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Adding…';

    var form = {
      name: document.getElementById('name').value,
      type: document.getElementById('type').value,
      parentId: document.getElementById('parent').value,
      newGroupName: document.getElementById('newGroupName').value,
      essential: document.getElementById('essential').value,
      incomeStability: document.getElementById('incomeStability').value,
      monthlyBudget: document.getElementById('monthlyBudget').value
    };

    google.script.run
      .withSuccessHandler(function (res) {
        msg.className = 'msg ok'; msg.textContent = res.message;
        btn.disabled = false; btn.textContent = 'Add category';
      })
      .withFailureHandler(function (err) {
        msg.className = 'msg err'; msg.textContent = err.message || String(err);
        btn.disabled = false; btn.textContent = 'Add category';
      })
      .addCategory(form);
  }
</script>
</body>
</html>

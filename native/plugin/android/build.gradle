buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.13.0'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20' }
}
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
android {
    namespace = 'app.hearth.hearthside'
    compileSdk = 36
    defaultConfig { minSdk = 24; targetSdk = 36; testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
    kotlinOptions { jvmTarget = '21' }
}
repositories { google(); mavenCentral() }
dependencies {
    implementation project(':capacitor-android')
    // These Android types are used directly; Capacitor/SceneView implementation dependencies do not export them.
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.9.4'
    implementation 'androidx.browser:browser:1.9.0'
    implementation 'io.github.sceneview:arsceneview:2.3.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}

<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  :root {
    --surface: #fcfcfb; --card: #ffffff; --border: #e2e2df; --grid: #e4e3e0;
    --ink: #1a1a19; --ink-muted: #6b6b68; --bar: #2a78d6; --bar-hover: #1f5fb0;
  }
  body.dark {
    --surface: #1a1a19; --card: #242422; --border: #3a3a36; --grid: #33332f;
    --ink: #f2f2f0; --ink-muted: #a8a8a4; --bar: #3987e5; --bar-hover: #5fa2ef;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif; margin: 0; padding: 14px 16px;
    background: var(--surface); color: var(--ink);
  }
  h3 { margin: 0 0 12px; font-size: 15px; display: flex; align-items: center; justify-content: space-between; }
  .topbtns { display: flex; gap: 6px; }
  .iconbtn {
    background: none; border: 1px solid var(--border); color: var(--ink-muted); border-radius: 6px;
    padding: 5px 9px; font-size: 12px; cursor: pointer;
  }
  .iconbtn:hover { color: var(--ink); }
  .controls { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; font-weight: 600; color: var(--ink-muted); }
  select {
    padding: 7px 8px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px;
    font-family: inherit; background: var(--card); color: var(--ink); min-width: 150px;
  }
  .type-toggle { display: flex; gap: 6px; }
  .type-toggle button {
    padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--card);
    color: var(--ink); cursor: pointer; font-size: 12px; font-weight: 600;
  }
  .type-toggle button.active.expense { background: #fdeee7; border-color: #ec835a; color: #b85a34; }
  .type-toggle button.active.income { background: #e6f6e6; border-color: #0ca30c; color: #0ca30c; }
  body.dark .type-toggle button.active.expense { background: #3a2620; color: #f0a583; }
  body.dark .type-toggle button.active.income { background: #1f3a1f; color: #7bd67b; }
  button.primary {
    background: var(--bar); color: #fff; border: none; padding: 8px 16px; border-radius: 6px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button.primary:hover { background: var(--bar-hover); }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  .msg { font-size: 13px; padding: 8px 10px; border-radius: 6px; margin-bottom: 12px; display: none; }
  .msg.err { background: #fbe8e8; color: #a52a2a; display: block; }
  .summary { font-size: 13px; color: var(--ink-muted); margin-bottom: 10px; }
  .summary b { color: var(--ink); }
  .chartwrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--card); padding: 10px 10px 0; }
  .chart { position: relative; display: flex; align-items: flex-end; height: 240px; min-width: 100%; }
  .gridlines { position: absolute; left: 0; right: 0; top: 0; height: 210px; pointer-events: none; }
  .gridline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--grid); }
  .gridline span { position: absolute; right: 4px; top: -14px; font-size: 10px; color: var(--ink-muted); background: var(--card); padding: 0 3px; }
  .month-group { display: flex; flex-direction: column; align-items: center; padding: 0 10px; border-right: 1px solid var(--border); }
  .month-group:last-child { border-right: none; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 210px; }
  .bar {
    width: 22px; background: var(--bar); border-radius: 4px 4px 0 0; cursor: pointer;
    transition: background 0.1s ease; position: relative; min-height: 1px;
  }
  .bar:hover { background: var(--bar-hover); }
  .month-label { font-size: 11px; color: var(--ink-muted); margin-top: 8px; white-space: nowrap; }
  .empty { padding: 30px 10px; text-align: center; color: var(--ink-muted); font-size: 13px; }
  .tooltip {
    position: fixed; background: var(--ink); color: var(--surface); font-size: 12px; padding: 6px 9px;
    border-radius: 6px; pointer-events: none; display: none; z-index: 10; white-space: nowrap;
  }
  .tablewrap { display: none; margin-top: 12px; max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--ink-muted); font-weight: 600; position: sticky; top: 0; background: var(--card); }
  td.amt, th.amt { text-align: right; }
</style>
</head>
<body>
  <h3>
    Category spending
    <span class="topbtns">
      <button class="iconbtn" id="tableToggle" onclick="toggleTable()">View as table</button>
      <button class="iconbtn" id="darkToggle" onclick="toggleDark()">Dark mode</button>
    </span>
  </h3>

  <div class="controls">
    <div class="field">
      <label>Type</label>
      <div class="type-toggle">
        <button type="button" id="btnExpense" class="active expense" onclick="setType('Expense')">Expense</button>
        <button type="button" id="btnIncome" class="income" onclick="setType('Income')">Income</button>
      </div>
    </div>
    <div class="field">
      <label>Category</label>
      <select id="category"></select>
    </div>
    <div class="field">
      <label>Time range</label>
      <select id="monthsBack">
        <option value="3">Last 3 months</option>
        <option value="6" selected>Last 6 months</option>
        <option value="12">Last 12 months</option>
      </select>
    </div>
    <button class="primary" id="showBtn" onclick="load()">Show chart</button>
  </div>

  <div class="msg err" id="msg"></div>
  <div class="summary" id="summary"></div>

  <div class="chartwrap">
    <div class="chart" id="chart"><div class="empty">Choose a category and click "Show chart".</div></div>
  </div>

  <div class="tablewrap" id="tablewrap">
    <table>
      <thead><tr><th>Month</th><th>Week</th><th class="amt">Amount</th></tr></thead>
      <tbody id="tablebody"></tbody>
    </table>
  </div>

  <div class="tooltip" id="tooltip"></div>

<script>
  var CATEGORIES = <?!= JSON.stringify(categories) ?>;
  var currentType = 'Expense';
  var lastData = null;

  var catSelect = document.getElementById('category');
  function renderCategories() {
    catSelect.innerHTML = '';
    CATEGORIES.filter(function (c) { return c.transactionType === currentType; })
      .forEach(function (c) {
        var opt = document.createElement('option');
        opt.value = c.subId; opt.textContent = c.subName;
        catSelect.appendChild(opt);
      });
  }

  function setType(type) {
    currentType = type;
    document.getElementById('btnExpense').className = 'expense' + (type === 'Expense' ? ' active' : '');
    document.getElementById('btnIncome').className = 'income' + (type === 'Income' ? ' active' : '');
    renderCategories();
  }
  setType('Expense');

  function toggleDark() {
    document.body.classList.toggle('dark');
    document.getElementById('darkToggle').textContent = document.body.classList.contains('dark') ? 'Light mode' : 'Dark mode';
    if (lastData) renderChart(lastData); // re-render so bar colors pick up the new CSS variables cleanly
  }

  function toggleTable() {
    var tw = document.getElementById('tablewrap');
    var showing = tw.style.display === 'block';
    tw.style.display = showing ? 'none' : 'block';
    document.getElementById('tableToggle').textContent = showing ? 'View as table' : 'Hide table';
  }

  function fmtMoney(n) {
    return '$' + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function load() {
    var msg = document.getElementById('msg');
    msg.style.display = 'none'; msg.textContent = '';
    var btn = document.getElementById('showBtn');
    var subId = catSelect.value;
    if (!subId) { msg.textContent = 'Add a category of this type first.'; msg.style.display = 'block'; return; }
    btn.disabled = true; btn.textContent = 'Loading…';

    google.script.run
      .withSuccessHandler(function (data) {
        btn.disabled = false; btn.textContent = 'Show chart';
        lastData = data;
        renderChart(data);
        renderTable(data);
      })
      .withFailureHandler(function (err) {
        btn.disabled = false; btn.textContent = 'Show chart';
        msg.textContent = err.message || String(err);
        msg.style.display = 'block';
      })
      .getCategorySpendingData(subId, document.getElementById('monthsBack').value);
  }

  function renderChart(data) {
    var chart = document.getElementById('chart');
    var summary = document.getElementById('summary');
    chart.innerHTML = '';

    var allWeeks = [];
    data.months.forEach(function (m) { m.weeks.forEach(function (w) { allWeeks.push(w.amount); }); });
    var maxVal = Math.max.apply(null, allWeeks.concat([0]));

    summary.innerHTML = '<b>' + data.subName + '</b> (' + data.type + ') — total ' + fmtMoney(data.total) +
      ' over the selected range, weekly, grouped by month.';

    if (maxVal <= 0) {
      chart.innerHTML = '<div class="empty">No ' + data.type.toLowerCase() + ' transactions found for ' + data.subName + ' in this range.</div>';
      return;
    }

    var headroom = maxVal * 1.15;
    var gridWrap = document.createElement('div');
    gridWrap.className = 'gridlines';
    [0, 0.25, 0.5, 0.75, 1].forEach(function (f) {
      var line = document.createElement('div');
      line.className = 'gridline';
      line.style.top = (210 - f * 210) + 'px';
      var lbl = document.createElement('span');
      lbl.textContent = fmtMoney(Math.round(headroom * f));
      line.appendChild(lbl);
      gridWrap.appendChild(line);
    });
    chart.appendChild(gridWrap);

    data.months.forEach(function (m) {
      var group = document.createElement('div');
      group.className = 'month-group';

      var bars = document.createElement('div');
      bars.className = 'bars';
      m.weeks.forEach(function (w) {
        var bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.height = Math.max(1, (w.amount / headroom) * 210) + 'px';
        bar.addEventListener('mousemove', function (e) { showTooltip(e, m.label + ' · ' + w.label + ': ' + fmtMoney(w.amount)); });
        bar.addEventListener('mouseleave', hideTooltip);
        bars.appendChild(bar);
      });
      group.appendChild(bars);

      var label = document.createElement('div');
      label.className = 'month-label';
      label.textContent = m.label;
      group.appendChild(label);

      chart.appendChild(group);
    });
  }

  function renderTable(data) {
    var body = document.getElementById('tablebody');
    body.innerHTML = '';
    data.months.forEach(function (m) {
      m.weeks.forEach(function (w) {
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>' + m.label + '</td><td>' + w.label + '</td><td class="amt">' + fmtMoney(w.amount) + '</td>';
        body.appendChild(tr);
      });
    });
  }

  function showTooltip(e, text) {
    var tip = document.getElementById('tooltip');
    tip.textContent = text;
    tip.style.display = 'block';
    tip.style.left = (e.clientX + 12) + 'px';
    tip.style.top = (e.clientY + 12) + 'px';
  }
  function hideTooltip() { document.getElementById('tooltip').style.display = 'none'; }
</script>
</body>
</html>

# Rollback static host only. Cloudflare Workers is the website. Supabase is the books.
# Do not use Blobs as the ledger.
[build]
  command = "pnpm build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10.14.0"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[[redirects]]
  from = "/api/hearth"
  to = "/.netlify/functions/hearth"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; padding: 4px 8px; color: #222; }
  h3 { margin: 0 0 12px; font-size: 15px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #555; margin: 12px 0 4px; }
  input, select, textarea {
    width: 100%; box-sizing: border-box; padding: 7px 8px; font-size: 14px;
    border: 1px solid #ccc; border-radius: 6px; font-family: inherit;
  }
  .type-toggle { display: flex; gap: 8px; }
  .type-toggle button {
    flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #ccc; background: #f4f4f4;
    cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .type-toggle button.active.income { background: #e6f6e6; border-color: #0ca30c; color: #0ca30c; }
  .type-toggle button.active.expense { background: #fdeee7; border-color: #ec835a; color: #b85a34; }
  .actions { margin-top: 18px; display: flex; justify-content: flex-end; gap: 8px; }
  button.primary {
    background: #2a78d6; color: #fff; border: none; padding: 9px 18px; border-radius: 6px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.primary:disabled { background: #9db8dd; cursor: default; }
  button.secondary { background: none; border: 1px solid #ccc; padding: 9px 14px; border-radius: 6px; cursor: pointer; }
  .msg { margin-top: 12px; font-size: 13px; padding: 8px 10px; border-radius: 6px; display: none; }
  .msg.ok { background: #e6f6e6; color: #0a6b0a; display: block; }
  .msg.err { background: #fbe8e8; color: #a52a2a; display: block; }
  .amount-row { display: flex; align-items: center; }
  .amount-row span { padding: 0 6px; color: #888; }
</style>
</head>
<body>
  <h3>Add a transaction</h3>

  <label>Type</label>
  <div class="type-toggle">
    <button type="button" id="btnExpense" class="active expense" onclick="setType('Expense')">Expense</button>
    <button type="button" id="btnIncome" class="income" onclick="setType('Income')">Income</button>
  </div>
  <input type="hidden" id="type" value="Expense">

  <label>Date</label>
  <input type="date" id="date">

  <label>Amount</label>
  <div class="amount-row"><span>$</span><input type="number" id="amount" step="0.01" min="0" placeholder="0.00"></div>

  <label>Category</label>
  <select id="category"></select>

  <label>Who</label>
  <select id="member">
    <option value="">Joint / Shared</option>
  </select>

  <label>Note (optional)</label>
  <input type="text" id="note" placeholder="e.g. Uber to the airport">

  <div class="msg" id="msg"></div>

  <div class="actions">
    <button class="secondary" onclick="google.script.host.close()">Cancel</button>
    <button class="primary" id="submitBtn" onclick="submitForm()">Add transaction</button>
  </div>

<script>
  var CATEGORIES = <?!= JSON.stringify(categories) ?>;
  var MEMBERS = <?!= JSON.stringify(members) ?>;

  var memberSelect = document.getElementById('member');
  MEMBERS.forEach(function (m) {
    var opt = document.createElement('option');
    opt.value = m.id; opt.textContent = m.name;
    memberSelect.appendChild(opt);
  });

  document.getElementById('date').valueAsDate = new Date();

  function renderCategories(type) {
    var sel = document.getElementById('category');
    var prevValue = sel.value; // remember what was picked before rebuilding
    sel.innerHTML = '';
    CATEGORIES.filter(function (c) { return c.transactionType === type; })
      .forEach(function (c) {
        var opt = document.createElement('option');
        opt.value = c.subId; opt.textContent = c.subName;
        sel.appendChild(opt);
      });
    // Re-select the same category if it's still valid for this type (e.g.
    // clicking the already-active Expense/Income button, or switching away
    // and back) — only falls back to the first item when the previous
    // pick doesn't exist in the new list (a genuine type switch).
    if (prevValue && sel.querySelector('option[value="' + prevValue + '"]')) {
      sel.value = prevValue;
    }
  }

  function setType(type) {
    document.getElementById('type').value = type;
    document.getElementById('btnExpense').className = 'expense' + (type === 'Expense' ? ' active' : '');
    document.getElementById('btnIncome').className = 'income' + (type === 'Income' ? ' active' : '');
    renderCategories(type);
  }

  setType('Expense');

  function submitForm() {
    var msg = document.getElementById('msg');
    msg.className = 'msg'; msg.textContent = '';
    var btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Adding…';

    var form = {
      date: document.getElementById('date').value,
      type: document.getElementById('type').value,
      amount: document.getElementById('amount').value,
      subId: document.getElementById('category').value,
      memberId: document.getElementById('member').value,
      note: document.getElementById('note').value
    };

    google.script.run
      .withSuccessHandler(function (res) {
        msg.className = 'msg ok'; msg.textContent = res.message;
        document.getElementById('amount').value = '';
        document.getElementById('note').value = '';
        btn.disabled = false; btn.textContent = 'Add transaction';
      })
      .withFailureHandler(function (err) {
        msg.className = 'msg err'; msg.textContent = err.message || String(err);
        btn.disabled = false; btn.textContent = 'Add transaction';
      })
      .addTransaction(form);
  }
</script>
</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hearth capture</title><style>body{font:14px system-ui;width:300px;padding:16px;color:#29251f}button{width:100%;padding:10px;margin-top:8px}p{line-height:1.4}.quiet{color:#6f675d}</style></head>
<body><h1>Hearth capture</h1><p>Capture only fixed employee-visible 7shifts schedule and timesheet facts. Passwords, cookies, authorization headers, and other sites are never collected.</p><label>Your exact 7shifts display name<input id="selfName" autocomplete="name"></label><label>Capture-only companion token<input id="companion" type="password" autocomplete="off"></label><button id="register" type="button">Register autonomous capture</button><button id="sync" type="button">Sync now</button><button id="gmail" type="button">Connect Gmail for 7shifts updates</button><p class="quiet">Automatic only while Chrome is running. A red ! means sign back into 7shifts or reconnect Hearth.</p><hr><label>One-use fallback code<input id="capability" type="password" autocomplete="off"></label><button id="pair" type="button">Pair for one upload</button><button id="enable" type="button">Enable for this tab</button><button id="schedule" type="button" disabled>Capture visible schedule</button><button id="timesheet" type="button" disabled>Capture visible timesheet</button><button id="screen" type="button" disabled>Capture visible screen</button><button id="stop" type="button" disabled>Stop this session</button><p id="status" class="quiet" role="status">Off</p><script src="capture-safety.js"></script><script src="visible-schedule.js"></script><script src="visible-timesheet.js"></script><script src="popup.js"></script></body></html>

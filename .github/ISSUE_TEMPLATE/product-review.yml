name: Product review
description: Review one workflow, screen, calculation, or cross-feature behavior.
title: "[Review] "
labels:
  - review
body:
  - type: markdown
    attributes:
      value: |
        Use evidence from the current Git commit and the running Hearth app. `docs/nostalgia/` and `docs/reference/` are history, not acceptance criteria. Dual Course: name a budget delta (weight 5) and an engagement delta (weight 3).
  - type: input
    id: goal
    attributes:
      label: User outcome
      description: What should Jonathan or Bianca be able to accomplish?
      placeholder: Enter a grocery split from a phone without leaving cents on the table.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current behavior and evidence
      description: Include environment (Development/Production), screen, reproducible steps, and observed result.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      options:
        - Low
        - Medium — code
        - Medium — UX
        - High — financial logic, migration, permissions, or release
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope
      description: Name the commands, screens, or user flows to review.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable pass/fail outcomes, including mobile and data-integrity expectations where relevant.
      placeholder: |
        - [ ] Required fields reject invalid input without posting rows.
        - [ ] A successful submission creates exactly one ledger transaction.
        - [ ] Development health stays clean.
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Explicitly out of scope
      description: What should not change during this task?
  - type: textarea
    id: verification
    attributes:
      label: Verification and handoff
      description: Tests, live evidence, reviewer, and decision still needed.

name: Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Warn if this job cannot publish
        if: github.event_name != 'pull_request' && env.HAS_CF_SECRETS != 'true'
        env:
          HAS_CF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          echo "::warning::GitHub secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are empty, so this workflow did not publish hearth-books. Point Cloudflare Workers Builds at main, or add those secrets. A green build is not a live kitchen site."
      - name: Deploy
        if: github.event_name != 'pull_request' && env.HAS_CF_SECRETS == 'true'
        env:
          HAS_CF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -f dist/_redirects
          npx wrangler deploy --assets=./dist

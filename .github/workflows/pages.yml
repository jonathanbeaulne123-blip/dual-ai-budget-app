name: Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      plan_system_v2:
        description: Plan System V2 presentation (set 0 for legacy rollback)
        type: choice
        options: ["1", "0"]
        default: "1"
      hercules_actions:
        description: Confirmed Hercules actions in Development only
        type: choice
        options: ["1", "0"]
        default: "1"
      hercules_chat:
        description: Hercules conversation presentation (compatible writer retained)
        type: choice
        options: ["1", "0"]
        default: "1"
      hercules_discovery:
        description: Hercules suggestions presentation
        type: choice
        options: ["1", "0"]
        default: "1"
      hercules_wardrobe:
        description: Hercules dressing room presentation
        type: choice
        options: ["1", "0"]
        default: "1"

concurrency:
  group: hearth-books-${{ github.event_name == 'pull_request' && github.run_id || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and verify Hercules document container
        run: node scripts/verify-workspace-container.mjs
      - name: Build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_SUPABASE_AUTH_ENABLED: "1"
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CONTINUITY_REALTIME: "1"
          VITE_CONTINUITY_COMMAND_LOG: "1"
          VITE_CLOUD_LEDGER_ONLINE_REQUIRED: "1"
          VITE_PGLITE_INCREMENTAL_DEV: "1"
          VITE_PRODUCTION_CONTINUITY: "0"
          VITE_SYNC_PILOT_DIAGNOSTICS: "1"
          VITE_PLAN_SYSTEM_V2: ${{ inputs.plan_system_v2 || '1' }}
          VITE_HERCULES_ACTIONS: ${{ inputs.hercules_actions || vars.VITE_HERCULES_ACTIONS || '1' }}
          VITE_HERCULES_WORKSPACE: "1"
          VITE_HERCULES_CHAT: ${{ inputs.hercules_chat || vars.VITE_HERCULES_CHAT || '1' }}
          VITE_HERCULES_DISCOVERY: ${{ inputs.hercules_discovery || vars.VITE_HERCULES_DISCOVERY || '1' }}
          VITE_HERCULES_DRESSING_ROOM: ${{ inputs.hercules_wardrobe || vars.VITE_HERCULES_DRESSING_ROOM || '1' }}
        run: |
          . scripts/sanitize-cloudflare-env.sh
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::warning::VITE_GOOGLE_CLIENT_ID is empty, so this kitchen build ships without Google sign-in. Add the public web client ID as a GitHub Actions variable (not a client secret)."
          fi
          test "$VITE_SUPABASE_AUTH_ENABLED" = "1"
          test "$VITE_CONTINUITY_REALTIME" = "1"
          test "$VITE_CONTINUITY_COMMAND_LOG" = "1"
          test "$VITE_CLOUD_LEDGER_ONLINE_REQUIRED" = "1"
          test "$VITE_PGLITE_INCREMENTAL_DEV" = "1"
          test "$VITE_PRODUCTION_CONTINUITY" = "0"
          test "$VITE_SYNC_PILOT_DIAGNOSTICS" = "1"
          case "$VITE_PLAN_SYSTEM_V2" in 0|1) ;; *) echo "::error::Invalid Plan System V2 presentation switch"; exit 1;; esac
          echo "Development pilot boundary verified: Auth, Realtime, command log, online-required cloud-backed Personal and Shared writes, incremental PGlite, and privacy-safe diagnostics ON; Production continuity OFF."
          echo "Plan System V2 Development presentation=$VITE_PLAN_SYSTEM_V2 (set VITE_PLAN_SYSTEM_V2=0 for legacy rollback)."
          if [ "$VITE_CONTINUITY_COMMAND_LOG" = "1" ]; then
            echo "Tier 2 command-log transport is ON for this kitchen build (VITE_CONTINUITY_COMMAND_LOG=1; requires Migration 013)."
          fi
          for flag in "$VITE_HERCULES_ACTIONS" "$VITE_HERCULES_CHAT" "$VITE_HERCULES_DISCOVERY" "$VITE_HERCULES_DRESSING_ROOM"; do
            case "$flag" in 0|1) ;; *) echo "::error::Invalid Hercules presentation switch"; exit 1;; esac
          done
          echo "Hercules Development actions=$VITE_HERCULES_ACTIONS; presentation: chat=$VITE_HERCULES_CHAT discovery=$VITE_HERCULES_DISCOVERY wardrobe=$VITE_HERCULES_DRESSING_ROOM; compatible private writer retained."
          pnpm build
      - name: Deploy
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          . scripts/sanitize-cloudflare-env.sh
          echo "token_chars=${#CLOUDFLARE_API_TOKEN} account_chars=${#CLOUDFLARE_ACCOUNT_ID}"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN had no header-safe characters after cleaning. Re-paste the Cloudflare API token in GitHub → Settings → Secrets with no quotes."
            exit 1
          fi
          rm -f dist/_redirects
          npx wrangler deploy --assets=./dist

name: Horizon baked assets

on:
  pull_request:
    paths:
      - 'scripts/horizon/**'
      - 'src/harbour/horizon/**'
      # PR #566 Codex: Mountain v2's sources feed land/mountainV2/v2-data.json (dump-mountain-v2.mjs --check).
      - 'src/harbour/mountain/**'
      # Horizon → Journey rule (D74): the Journey map is drawn from the bake; its land reader runs with the bake check.
      - 'src/journey/land/**'
      - 'public/horizon/**'
      - 'test/horizonBakeArtifacts.test.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/horizon-assets.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/horizon/**'
      - 'src/harbour/horizon/**'
      # PR #566 Codex: Mountain v2's sources feed land/mountainV2/v2-data.json (dump-mountain-v2.mjs --check).
      - 'src/harbour/mountain/**'
      # Horizon → Journey rule (D74): the Journey map is drawn from the bake; its land reader runs with the bake check.
      - 'src/journey/land/**'
      - 'public/horizon/**'
      - 'test/horizonBakeArtifacts.test.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/horizon-assets.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run test/horizonBakeArtifacts.test.ts --maxWorkers=1
      # PR #566 Codex: horizon:check runs the terrain bake check and the Mountain v2 data check (dump-mountain-v2.mjs --check).
      - run: pnpm horizon:check

name: Horizon baked assets

on:
  pull_request:
    paths:
      - 'scripts/horizon/**'
      - 'src/harbour/horizon/**'
      - 'public/horizon/**'
      - 'test/horizonBakeArtifacts.test.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/horizon-assets.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/horizon/**'
      - 'src/harbour/horizon/**'
      - 'public/horizon/**'
      - 'test/horizonBakeArtifacts.test.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/horizon-assets.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run test/horizonBakeArtifacts.test.ts --maxWorkers=1
      - run: pnpm horizon:check

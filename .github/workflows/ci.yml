name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for real browser continuity and media tests
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm check
        env:
          HEARTH_TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEARTH_TEST_RISK: medium

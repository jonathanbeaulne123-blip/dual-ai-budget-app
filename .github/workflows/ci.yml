name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exclude unused Google Chrome apt source
        # Playwright supplies its pinned Chromium; this preinstalled runner source
        # is unrelated and can fail apt update while Google's mirror is syncing.
        run: |
          for source in /etc/apt/sources.list.d/*.list; do
            if [ -f "$source" ] && grep -q 'dl.google.com/linux/chrome' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
      - name: Install Chromium for real browser continuity and media tests
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm check
        env:
          HEARTH_TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEARTH_TEST_RISK: medium
      - name: Verify Home setup and Kitty Bank browser flows when changed
        env:
          HEARTH_TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --name-only "$HEARTH_TEST_BASE" HEAD -- src/App.tsx src/HouseholdHome.tsx src/ChapterPanel.tsx src/household-home.css src/kitty/KittyBankRoom.tsx test/home-feedback-layout.mjs scripts/serve-home-feedback-proof.mjs | grep -q .; then
            node test/home-feedback-layout.mjs
          fi
      - name: Keep Home browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-feedback-browser
          path: .artifacts/feedback-home/actual-app
          if-no-files-found: ignore
          retention-days: 7

name: Hearthside unsigned native
on:
  pull_request:
    paths:
      - '.github/workflows/hearthside-native.yml'
      - 'native/**'
      - 'src/**'
      - 'public/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'scripts/build-hercules-pro-ui.mjs'
permissions:
  contents: read
concurrency:
  group: hearthside-native-${{ github.event.pull_request.number }}
  cancel-in-progress: true
# No credentials, environment activation, signing identity, deployment, or uploaded artifacts.
# Root and native each use their own frozen lockfile. App build includes the actual shared React UI.
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - name: Install and build the shared app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Prepare locked Capacitor projects and authored assets
        working-directory: native
        run: |
          pnpm install --frozen-lockfile
          pnpm prepare:assets
          node --test ci/verification.test.mjs
          pnpm prepare:platforms
      - name: Verify and unpack XcodeGen 2.44.1
        run: |
          curl --fail --location --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip --output "$RUNNER_TEMP/hearth-xcodegen.zip"
          printf '%s  %s\n' 'a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73' "$RUNNER_TEMP/hearth-xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/hearth-xcodegen.zip" -d "$RUNNER_TEMP/hearth-xcodegen"
          echo "HEARTH_XCODEGEN=$RUNNER_TEMP/hearth-xcodegen/xcodegen/bin/xcodegen" >> "$GITHUB_ENV"
      - name: Build unsigned iOS app and widget; run production plugin XCTest
        run: bash native/scripts/run-ios-checks.sh
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21.0.8+9
      - name: Install and build the shared app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Prepare locked Capacitor projects and authored assets
        working-directory: native
        run: |
          pnpm install --frozen-lockfile
          pnpm prepare:assets
          node --test ci/verification.test.mjs
          pnpm prepare:platforms
          node scripts/check-packaged-web.mjs android
      - name: Install compile SDK and enable emulator acceleration
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile unsigned distributable and test applications
        working-directory: native/android
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleRelease :app:assembleDebugAndroidTest :hearth-hearthside-native:assembleDebugAndroidTest
      - name: Real Activity / React boot and plugin isolation instrumentation
        uses: ReactiveCircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: native/android
          script: ./gradlew --no-daemon --max-workers=2 :app:connectedDebugAndroidTest :hearth-hearthside-native:connectedDebugAndroidTest
